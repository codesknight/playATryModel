name: Python checks # 在 GitHub 页面显示的检查名称。
on: [push, pull_request, workflow_dispatch] # 推送、提交 PR 或手动触发时运行。
permissions: # 声明工作流需要的权限。
  contents: read # 只读取仓库内容。
jobs: # 定义需要执行的任务。
  smoke: # 检查基本运行流程的任务。
    runs-on: ubuntu-latest # 使用 GitHub 提供的 Linux 环境。
    timeout-minutes: 10 # 最多运行十分钟，防止异常任务一直占用资源。
    env: # 设置任务中所有步骤可用的环境变量。
      PYTHONIOENCODING: utf-8 # 让中文输出使用 UTF-8 编码。
    steps: # 按顺序执行下面的步骤。
      - uses: actions/checkout@v4 # 获取本次提交的仓库文件。
      - uses: actions/setup-python@v5 # 准备 Python 环境。
        with: # 传递 Python 环境配置。
          python-version: '3.13' # 与本地已验证的 Python 主次版本保持一致。
          cache: pip # 缓存依赖下载，加快后续检查。
      - name: Install dependencies # 安装项目依赖。
        run: python -m pip install -r requirements.txt # 按依赖清单安装 NumPy。
      - name: Check Python syntax # 检查所有脚本能否正确解析。
        run: python -m compileall -q scripts # 编译脚本，仅在出错时显示详细信息。
      - name: Generate from baseline # 检查仓库内的示例权重可以加载。
        run: python scripts/example/generate.py --prompt "小猫" --length 20 # 使用移动到 example 目录中的示例模型。
      - name: Train and reload # 检查训练保存和重新加载是否正常。
        run: | # 下面的命令依次执行，有一步失败就停止。
          python scripts/example/train.py --steps 2 --output "$RUNNER_TEMP/smoke.npz" # 短训练只写入临时目录。
          python scripts/example/generate.py --model "$RUNNER_TEMP/smoke.npz" --prompt "小猫" --length 10 # 重新加载新权重并生成文字。
      - name: Check completed lessons # 运行已完成的数据、模型与训练练习。
        run: | # 按顺序检查数据可复现性、模型计算与短训练流程。
          python scripts/learn/27_split_chat_groups.py # 只读核对已冻结的示例分组划分。
          python scripts/ci/check_chat_group_split.py # 检查映射稳定、覆盖和拒绝静默覆盖。
          python scripts/learn/26_chat_sft_format.py # 核对聊天角色和仅助手目标的教学演示。
          python scripts/ci/check_chat_preparation.py # 核对SFT首字对齐、多轮及无效会话拒绝。
          python scripts/experiments/estimate_chat_budget.py # 仅核算候选参数和1GB权重预算，不训练。
          python scripts/learn/01_inspect_data.py # 验证四份原始文本都可以读取。
          python scripts/learn/02_clean_data.py # 重新生成清洗结果，并执行脚本内的断言。
          python scripts/learn/03_split_chapters.py # 运行章节识别、无损切分、JSONL 保存及重载检查。
          python scripts/learn/04_split_dataset.py # 重新划分整章数据并执行集合互斥及覆盖检查。
          python scripts/learn/05_build_vocab.py # 只从训练集重建词表，检查编码解码及验证集未知率。
          python scripts/learn/06_make_windows.py # 检查预测窗口和 NumPy 批次的形状、错位关系、数量及尾批。
          python scripts/learn/07_tiny_rnn.py # 检查前向与损失、五组完整梯度、全局范数裁剪及单步更新。
          python scripts/learn/08_gradient_demo.py # 检查数值梯度和单参数梯度下降的更新方向。
          python scripts/learn/09_softmax_gradient.py # 检查分数、输出层、循环单步与整段反向、表示表重复编号累加。
          python scripts/learn/10_train_one_batch.py # 读取真实训练批次，检查完整反向、全局裁剪和一次参数更新。
          python scripts/learn/11_train_steps.py # 检查连续训练、固定验证子集、权重保存重载及参数与预测一致性。
          python scripts/learn/12_generate_text.py # 独立加载权重，检查贪心、温度概率、固定种子采样与参数不变。
          python scripts/ci/check_lesson29.py # 只读检查四份实验权重、验证损失与生成流程，不重跑两百步训练。
          python scripts/learn/14_frequency_baseline.py # 只用训练目标拟合字频，核对同范围验证损失与重复逗号诊断。
          python scripts/learn/15_overfit_one_window.py # 重复拟合一个窗口，检查训练损失、正确位置数与首字生成复现。
          python scripts/ci/check_lesson32.py # 只读核对五份整轮检查点、尾批覆盖与完整验证和字频分数，不重训一轮。
          python scripts/ci/check_lesson33.py # 只读核对三轮完整验证、逐轮顺序与独立最佳快照，不重训两轮。
          python scripts/ci/check_lesson34.py # 只读复算循环连接消融实验，并检查原权重及报告未变。
          python scripts/ci/check_lesson35.py # 只读复算完整验证的损失、困惑度、准确率与命中数，并检查文件未变。
          python scripts/ci/check_lesson36.py # 只读复核两组学习率分支、完整验证、数据预算与包括起点的选择，不重训分支。
          python scripts/ci/check_lesson37.py # 只读复算第四轮检查点、短实验前缀与最佳快照，不重训整轮。
          python scripts/ci/check_lesson38.py # 只读重放早停规则，检查等待次数、阈值和停止后不使用未来记录。
          python scripts/ci/check_lesson39.py # 只读核对生成样例、重复统计、候选约束与采样不变量，不训练。
          python scripts/ci/check_lesson40.py # 核对Adam跨批历史并只读复算三份完整验证指标，不重训两个分支。
          python scripts/ci/check_lesson41.py # 只读复算Adam整轮候选、短实验前缀与最佳快照，不重新训练。
          git diff --exit-code -- data/corpus data/corpus_processed data/chapters data/splits data/vocab # 检查原文未变，且所有已完成的数据产物可复现。
  recurrent_models: # 独立检查PyTorch产物，保留原NumPy课程的依赖范围。
    runs-on: ubuntu-latest # 使用CPU验证GPU保存的模型。
    timeout-minutes: 10 # 不在CI中重新运行两轮训练。
    env: # 中文输出保持可读。
      PYTHONIOENCODING: utf-8 # 统一日志编码。
    steps: # 下载代码、安装CPU依赖并只读核验。
      - uses: actions/checkout@v4 # 获取已提交模型和报告。
      - uses: actions/setup-python@v5 # 使用与原任务相同的Python主次版本。
        with: # 配置独立CPU检查环境。
          python-version: '3.13' # 支持本次固定的PyTorch版本。
          cache: pip # 缓存依赖以减少重复下载。
          cache-dependency-path: requirements-torch.txt # PyTorch实验使用单独依赖清单。
      - name: Install CPU dependencies # 不下载CUDA运行库。
        run: | # 明确从官方CPU索引安装PyTorch。
          python -m pip install numpy==2.3.5 # 固定实际数据排列使用的NumPy版本。
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu # 只安装CPU轮子。
      - name: Check bounded recurrent experiment # 只读核对指标、预算和恢复能力。
        run: | # 只读核验两课产物，不调用真实训练入口。
          python scripts/ci/check_lesson42.py # 核验起点与结构对照。
          python scripts/ci/check_lesson43.py # 核验续训预算和保留的Adam历史。
          python scripts/ci/check_lesson44.py # 核验八轮续训、逐轮验证和最佳状态。
          python scripts/ci/check_lesson45.py # 核验新语料、因果遮罩和小型Transformer。
  chat_pilot: # 单独核对本课新数据与30M推理文件，不在CI训练。
    runs-on: ubuntu-latest # CPU复核GPU保存结果。
    timeout-minutes: 12 # 仅检查小子集与文件版本。
    env: # 日志中文保持一致。
      PYTHONIOENCODING: utf-8 # UTF-8输出。
    steps: # 原有课程保持独立。
      - uses: actions/checkout@v4 # 下载本课语料、编号与推理权重。
      - uses: actions/setup-python@v5 # 固定Python主次版本。
        with: # 使用与旧课程一致的版本。
          python-version: '3.13' # 本地已验证主次版本。
          cache: pip # 缓存已有依赖。
          cache-dependency-path: requirements-chat.txt # 本课新增tokenizers版本。
      - name: Install CPU chat dependencies # 不下载CUDA运行时。
        run: | # 从官方CPU索引安装PyTorch。
          python -m pip install numpy==2.3.5 tokenizers==0.22.2 # 与本次训练的分词和排列版本一致。
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu # 只复核无需显卡。
      - name: Check corpus tokenizer and pilot export # 不启动采集或长训练入口。
        run: | # 所有操作只读。
          python scripts/learn/28_inspect_chat_corpus.py # 核对六份划分、组交集和BPE往返。
          python scripts/ci/check_chat48.py # 核对预算、因果梯度和明确八窗范围的CPU指标。
          python scripts/ci/check_chat50.py # 核对完整状态续训、跨轮游标和独立新导出。
          python scripts/learn/29_gradient_accumulation.py # 短CPU实验，核对梯度与一次参数更新等价，不改已保存模型。
