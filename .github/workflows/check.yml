name: Python checks # 在 GitHub 页面显示的检查名称。
on: [push, pull_request, workflow_dispatch] # 推送、提交 PR 或手动触发时运行。
permissions: # 声明工作流需要的权限。
  contents: read # 只读取仓库内容。
jobs: # 定义需要执行的任务。
  smoke: # 检查基本运行流程的任务。
    runs-on: ubuntu-latest # 使用 GitHub 提供的 Linux 环境。
    timeout-minutes: 10 # 最多运行十分钟，防止异常任务一直占用资源。
    env: # 设置任务中所有步骤可用的环境变量。
      PYTHONIOENCODING: utf-8 # 让中文输出使用 UTF-8 编码。
    steps: # 按顺序执行下面的步骤。
      - uses: actions/checkout@v4 # 获取本次提交的仓库文件。
      - uses: actions/setup-python@v5 # 准备 Python 环境。
        with: # 传递 Python 环境配置。
          python-version: '3.13' # 与本地已验证的 Python 主次版本保持一致。
          cache: pip # 缓存依赖下载，加快后续检查。
      - name: Install dependencies # 安装项目依赖。
        run: python -m pip install -r requirements.txt # 按依赖清单安装 NumPy。
      - name: Check Python syntax # 检查所有脚本能否正确解析。
        run: python -m compileall -q scripts # 编译脚本，仅在出错时显示详细信息。
      - name: Generate from baseline # 检查仓库内的示例权重可以加载。
        run: python scripts/example/generate.py --prompt "小猫" --length 20 # 使用移动到 example 目录中的示例模型。
      - name: Train and reload # 检查训练保存和重新加载是否正常。
        run: | # 下面的命令依次执行，有一步失败就停止。
          python scripts/example/train.py --steps 2 --output "$RUNNER_TEMP/smoke.npz" # 短训练只写入临时目录。
          python scripts/example/generate.py --model "$RUNNER_TEMP/smoke.npz" --prompt "小猫" --length 10 # 重新加载新权重并生成文字。
      - name: Check completed lessons # 运行已完成的数据读取和清洗练习。
        run: | # 按顺序检查数据读取、清洗和结果是否可复现。
          python scripts/learn/01_inspect_data.py # 验证四份原始文本都可以读取。
          python scripts/learn/02_clean_data.py # 重新生成清洗结果，并执行脚本内的断言。
          python scripts/learn/03_split_chapters.py # 运行章节识别、无损切分、JSONL 保存及重载检查。
          git diff --exit-code -- data/corpus data/corpus_processed data/chapters # 检查原文未变，且清洗文本和章节记录可复现。
